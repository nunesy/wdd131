<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação do Produto</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <script defer src="scripts/formulario.js"></script>

    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulário de avaliação de produtos para coleta de feedback dos clientes sobre qualidade, facilidade de uso e desempenho.">
    <meta name="author" content="Yuri Barboza Nunes">
    
</head>
</head>
<body>
    <header>
        <h1>Avaliação do Produto</h1>
    </header>
    
    <main>
        <form action="avaliacao.html" method="get" class="review-form">
            
            <!-- Nome do Produto -->
            <div class="form-group">
                <label for="produto">Nome do Produto <span class="required">*</span></label>
                <select id="produto" name="produto" required>
                    <option value="" disabled selected>Selecione um produto ...</option>
                </select>
            </div>

            <!-- Classificação Geral -->
            <fieldset class="form-group border-none">
                <legend>Classificação Geral <span class="required">*</span></legend>
                <div class="rating-group">
                    <input type="radio" id="rating-1" name="rating" value="1" required>
                    <label for="rating-1" class="rating-label">☆</label>
                    
                    <input type="radio" id="rating-2" name="rating" value="2" required>
                    <label for="rating-2" class="rating-label">☆☆</label>
                    
                    <input type="radio" id="rating-3" name="rating" value="3" required>
                    <label for="rating-3" class="rating-label">☆☆☆</label>
                    
                    <input type="radio" id="rating-4" name="rating" value="4" required>
                    <label for="rating-4" class="rating-label">☆☆☆☆</label>
                    
                    <input type="radio" id="rating-5" name="rating" value="5" required>
                    <label for="rating-5" class="rating-label">☆☆☆☆☆</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="data-instalacao">Data de Instalação <span class="required">*</span></label>
                <input type="date" id="data-instalacao" name="data-instalacao" required>
            </div>

            <!-- (Checkboxes) -->
            <fieldset class="form-group border-none">
                <legend>Quais recursos você achou úteis no produto? <br><em>(Marque todos que se aplicam)</em></legend>
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" name="recursos" id="rec-durabilidade" value="durabilidade">
                        <label for="rec-durabilidade">Durabilidade</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="recursos" id="rec-facilidade" value="facilidade">
                        <label for="rec-facilidade">Facilidade de Uso</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="recursos" id="rec-desempenho" value="desempenho">
                        <label for="rec-desempenho">Desempenho</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="recursos" id="rec-design" value="design">
                        <label for="rec-design">Design</label>
                    </div>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="avaliacao-escrita">Avaliação Escrita <span class="optional">(Opcional)</span></label>
                <textarea id="avaliacao-escrita" name="avaliacao-escrita" rows="4" placeholder="Escreva sua experiência aqui..."></textarea>
            </div>

            <div class="form-group">
                <label for="nome-usuario">Seu Nome <span class="optional">(Opcional)</span></label>
                <input type="text" id="nome-usuario" name="nome-usuario" placeholder="Digite seu nome">
            </div>

            <!-- Botão -->
            <div class="form-submit">
                <input type="submit" value="Publicar Avaliação" class="btn-submit">
            </div>
            
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Yuri Nunes - Tarefa S05 Formulário de Avaliação</p>
    </footer>
</body>
</html>
